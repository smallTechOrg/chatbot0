[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["venv", "frontend", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "B008",   # flask-smorest / marshmallow use calls in defaults by design
    "RUF012", # marshmallow Meta classes are plain class attributes
]

[tool.ruff.lint.per-file-ignores]
"test/*" = ["B011", "SIM117", "RUF001", "RUF002", "RUF003"]
